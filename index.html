<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>YourLashes — Запись онлайн</title>
    <meta name="description" content="Запись к мастеру ресниц YourLashes" />
    <meta name="theme-color" content="#f0e4d8" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #f0e4d8;
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease-out;
        gap: 12px;
      }
      #splash img {
        width: 180px;
        height: auto;
      }
      #splash .splash-ring {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid rgba(196, 150, 122, 0.4);
        animation: splashRing 1.8s ease-out infinite;
      }
      #splash .splash-ring:nth-child(2) { animation-delay: 0.6s; }
      #splash .splash-ring:nth-child(3) { animation-delay: 1.2s; }
      @keyframes splashRing {
        0% { transform: scale(0.8); opacity: 0.8; }
        50% { opacity: 0.3; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      @keyframes splashVibe {
        0%, 100% { transform: scale(1); }
        25% { transform: scale(1.03) rotate(0.5deg); }
        50% { transform: scale(0.97) rotate(-0.5deg); }
        75% { transform: scale(1.02) rotate(0.3deg); }
      }
      #splash .logo-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash .logo-wrap img {
        animation: splashVibe 2s ease-in-out infinite;
      }
      #splash p {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        color: #9e8476;
        font-size: 12px;
        letter-spacing: 1px;
        animation: splashPulse 1.5s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
    </style>
    <script>
      (function() {
        var bg = "url('/background.jpg')";
        try {
          var be = (window.VITE_BACKEND_URL || 'https://liquid-glass-calendar-design.onrender.com');
          var xhr = new XMLHttpRequest();
          xhr.open('GET', be + '/api/settings', false);
          xhr.timeout = 3000;
          xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
              var data = JSON.parse(xhr.responseText);
              if (data.custom_background) {
                bg = "url('" + be + "/static/background.jpg?v=" + (data.bg_updated_at || Date.now()) + "')";
              }
            }
          };
          xhr.send();
        } catch(e) {}
        document.documentElement.style.setProperty('--app-bg', bg);
      })();
    </script>
  </head>
  <body>
    <div id="splash">
      <div class="splash-ring"></div>
      <div class="splash-ring"></div>
      <div class="splash-ring"></div>
      <div class="logo-wrap"><img src="/logo.png" alt="SOTOKA" /></div>
      <p>загрузка...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
